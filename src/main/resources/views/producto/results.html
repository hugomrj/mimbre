<div class="cliente-dropdown-list">
    {% for prod in productos %}
    <div class="cliente-dropdown-item" onclick="VentaManager.seleccionarProducto({{ prod.id }}, '{{ prod.nombre }}', {{ prod.precio }}, {{ prod.stock }})">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-weight: 600; color: var(--dark-text);">{{ prod.nombre }}</div>
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--primary);">₲ {{ prod.precio }}</div>
        </div>
        <div style="font-size: 0.75rem; color: var(--dark-text-muted); margin-top: 4px;">
            SKU: {{ prod.sku }} | 
            <span style="color: {% if prod.stock > 5 %}#22C55E{% else %}#EF4444{% endif %}; font-weight: 600;">
                Stock: {{ prod.stock }}
            </span>
        </div>
    </div>
    {% else %}
    <div style="padding: 12px; font-size: 0.85rem; color: var(--dark-text-muted); text-align: center;">
        No se encontraron productos
    </div>
    {% endfor %}
</div>

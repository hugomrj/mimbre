<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-filters">
        <button class="filter-chip active" onclick="setFilter(this)">Todos <span class="count">{{ productos.size() | default(0) }}</span></button>
    </div>
    <div class="toolbar-right">
        <button class="btn-ghost" onclick="showToast('Exportando...')"><i class="fas fa-file-export"></i> Exportar</button>
        <button class="btn-add" hx-get="/ui/productos/form" hx-target="#id-main"><i class="fas fa-plus"></i> Nuevo producto</button>
    </div>
</div>

<div class="table-card animate-fade-in delay-2">
    <table class="data-table">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
            <th style="text-align:right">Acciones</th>
        </tr>
        </thead>
        <tbody>
        {% for p in productos %}
        <tr class="row-anim" style="animation-delay: 0.04s">
            <td>
                <div class="product-info">
                    <span class="product-name">{{ p.nombre }}</span>
                    <span class="product-sku">{{ p.sku }}</span>
                </div>
            </td>
            <td><span class="price">₲ {{ p.precio }}</span></td>
            <td>
                <div class="stock-bar">
                    <span class="stock-num">{{ p.stock }}</span>
                </div>
            </td>
            <td style="color:var(--dark-text-muted)">{{ p.categoria }}</td>
            <td>
                <div class="row-actions">
                    <button class="row-action-btn" title="Editar" hx-get="/ui/productos/form?id={{ p.id }}" hx-target="#id-main"><i class="fas fa-pen"></i></button>
                    <button class="row-action-btn" title="Eliminar" onclick="abrirModalEliminacion('{{ p.nombre }}', '/ui/productos/delete/{{ p.id }}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5" style="text-align: center; padding: 32px; color: var(--dark-text-muted);">No hay productos registrados.</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% if mensaje %}
<script>if (typeof showToast === 'function') showToast("{{ mensaje }}", "success");</script>
{% endif %}
{% if error %}
<script>if (typeof showToast === 'function') showToast("{{ error }}", "error");</script>
{% endif %}

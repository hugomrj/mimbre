{% extends "layout.html" %}

{% block navbar_title %}
{% if producto.id %}Editar Producto{% else %}Nuevo Producto{% endif %}
{% endblock %}

{% block content %}
<div class="page-view page-view--medium">

    <div data-page-title="{% if producto.id %}Editar Producto{% else %}Nuevo Producto{% endif %}" style="display: none;"></div>

    <form id="formProducto" hx-post="/ui/productos/save" hx-target="#id-main" hx-select="#id-main" hx-push-url="/ui/productos/list" class="form-container animate-fade-in delay-1">
        {% if producto.id %}
        <input type="hidden" name="id" value="{{ producto.id }}">
        {% endif %}

        <div class="form-group col-full">
            <label class="form-label" for="prodNombre">Nombre del producto</label>
            <input type="text" id="prodNombre" name="nombre" value="{{ producto.nombre }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodSku">SKU / Código</label>
            <input type="text" id="prodSku" name="sku" value="{{ producto.sku }}" required class="form-control">
        </div>

        <div class="form-group col-4">
            <label class="form-label" for="prodCategoria">Categoría</label>
            <select id="prodCategoria" name="categoriaId" required class="form-control vanilla-select">
                <option value="" disabled {% if not producto.categoriaId %}selected{% endif %}>Seleccione una categoría</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if producto.categoriaId == cat.id %}selected{% endif %}>{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group col-3">
            <label class="form-label" for="prodPrecioVenta">Precio de venta</label>
            <input type="text" id="prodPrecioVenta" inputmode="numeric" name="precioVenta"
                   value="{{ producto.precioVentaMiles }}" required class="form-control money-input">
        </div>

        <div class="form-group col-3">
            <label class="form-label" for="prodPrecioCompra">Precio de compra</label>
            <input type="text" id="prodPrecioCompra" inputmode="numeric" name="precioCompra"
                   value="{% if producto.id %}{{ producto.precioCompraMiles }}{% else %}0{% endif %}" required class="form-control money-input">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodStock">Stock Actual</label>
            <input type="number" id="prodStock" name="stock" value="{{ producto.stock }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodCosto">Costo actual (kardex)</label>
            <input type="number" id="prodCosto" step="0.01" min="0" name="costoActual"
                   value="{{ producto.costoActual | default(0) }}" class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodStockMin">Stock mínimo</label>
            <input type="number" id="prodStockMin" min="0" name="stockMinimo"
                   value="{{ producto.stockMinimo | default(5) }}" class="form-control">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar Producto</button>
            <button type="button" class="btn-ghost" hx-get="/ui/productos/list" hx-target="#id-main" hx-select="#id-main" hx-push-url="true">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}

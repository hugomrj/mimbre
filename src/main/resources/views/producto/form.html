{% extends "layout.html" %}

{% block navbar_title %}
{% if producto.id %}Editar Producto{% else %}Nuevo Producto{% endif %}
{% endblock %}

{% block content %}
<div class="page-view page-view--medium">

    <div data-page-title="{% if producto.id %}Editar Producto{% else %}Nuevo Producto{% endif %}" style="display: none;"></div>

    <form hx-post="/ui/productos/save" hx-target="#id-main" hx-select="#id-main" hx-push-url="/ui/productos/list" class="form-container animate-fade-in delay-1">
        {% if producto.id %}
        <input type="hidden" name="id" value="{{ producto.id }}">
        {% endif %}

        <div class="form-group col-full">
            <label class="form-label" for="prodNombre">Nombre del producto</label>
            <input type="text" id="prodNombre" name="nombre" value="{{ producto.nombre }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodSku">SKU / Código</label>
            <input type="text" id="prodSku" name="sku" value="{{ producto.sku }}" required class="form-control">
        </div>

        <div class="form-group col-4">
            <label class="form-label" for="prodCategoria">Categoría</label>
            <select id="prodCategoria" name="categoria" required class="form-control vanilla-select">
                <option value="" disabled {% if not producto.categoria %}selected{% endif %}>Seleccione una categoría</option>
                {% for cat in categorias %}
                <option value="{{ cat.nombre }}" {% if producto.categoria == cat.nombre %}selected{% endif %}>{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodPrecio">Precio</label>
            <input type="number" id="prodPrecio" step="0.01" name="precio" value="{{ producto.precio }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodStock">Stock Actual</label>
            <input type="number" id="prodStock" name="stock" value="{{ producto.stock }}" required class="form-control">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar Producto</button>
            <button type="button" class="btn-ghost" hx-get="/ui/productos/list" hx-target="#id-main" hx-select="#id-main" hx-push-url="true">Cancelar</button>
        </div>
    </form>
</div>
{% endblock %}

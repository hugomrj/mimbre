<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">
            Nueva Venta / Facturación
        </h2>
    </div>
</div>

<div class="table-card animate-fade-in delay-2" style="padding: 24px;">

    <form hx-post="/ui/ventas/save" hx-target="#id-main" class="form-container" id="formVenta">

        <!-- FILA 1: Cliente Autocompletar (4/6) + Condición (2/6) -->
        <div class="form-group col-4" style="position: relative;">
            <label class="form-label" for="buscarClienteInput">Cliente</label>
            <input type="text" id="buscarClienteInput" name="q" placeholder="Escriba para buscar por Nombre o RUC/Cédula..." required class="form-control" autocomplete="off"
                   hx-get="/ui/clientes/buscar-cliente" hx-trigger="keyup changed delay:300ms, focus" hx-target="#clienteResultados"
                   oninput="document.getElementById('selectCliente').value=''">
            <input type="hidden" id="selectCliente" name="clienteId" required>
            <div id="clienteResultados"></div>
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="selectCondicion">Condición de Venta</label>
            <select id="selectCondicion" name="condicion" class="form-control">
                <option value="Contado" selected>Contado</option>
                <option value="Crédito">Crédito</option>
            </select>
        </div>

        <!-- SECCIÓN: Encabezado de Productos y Botón Modal -->
        <div class="form-group col-full" style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; margin-bottom: 4px;">
            <label class="form-label" style="font-weight: 600; font-size: 1rem; color: var(--primary); margin: 0;">
                <i class="fas fa-boxes-stacked"></i> Detalle de Productos
            </label>
            <button type="button" class="btn-add" onclick="VentaManager.abrirModalProducto()">
                <i class="fas fa-cart-plus"></i> Agregar Producto
            </button>
        </div>

        <!-- TABLA DE DETALLE DE LA VENTA -->
        <div class="form-group col-full" style="margin-top: 4px;">
            <table class="data-table" id="tablaItemsVenta">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th style="width: 120px; text-align: center;">Cantidad</th>
                    <th style="width: 150px; text-align: right;">Precio Unit.</th>
                    <th style="width: 150px; text-align: right;">Subtotal</th>
                    <th style="width: 60px; text-align: center;">Acción</th>
                </tr>
                </thead>
                <tbody id="tbodyItemsVenta">
                <tr id="rowVacia">
                    <td colspan="5" style="text-align: center; padding: 24px; color: var(--dark-text-muted);">
                        No se han agregado productos a la venta.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- CONTENEDOR OCULTO PARA FORM INPUTS -->
        <div id="inputsOcultosDetalle"></div>

        <!-- TOTAL GENERAL -->
        <div class="form-group col-full" style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--dark-card-border); padding-top: 16px; margin-top: 8px;">
            <div style="font-size: 1.1rem; color: var(--dark-text-muted);">
                Total a Pagar:
            </div>
            <div style="font-size: 1.75rem; font-weight: 700; color: var(--primary);" id="labelTotalVenta">
                ₲ 0
            </div>
        </div>

        <!-- FILA DE ACCIONES -->
        <div class="form-actions">
            <button type="submit" class="btn-add"><i class="fas fa-check"></i> Emitir Factura / Confirmar Venta</button>
            <button type="button" class="btn-ghost" hx-get="/ui/ventas/list" hx-target="#id-main">Cancelar</button>
        </div>

    </form>
</div>

<!-- MODAL BÚSQUEDA Y SELECCIÓN DE PRODUCTO -->
<div id="modalProducto" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title">
                <i class="fas fa-search" style="color: var(--primary);"></i> Buscar y Agregar Producto
            </div>
            <button type="button" class="modal-close-btn" onclick="VentaManager.cerrarModalProducto()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div style="position: relative;">
                <label class="form-label" for="buscarProductoInput">Buscar Producto</label>
                <input type="text" id="buscarProductoInput" placeholder="Escriba Nombre o SKU..." class="form-control" autocomplete="off"
                       hx-get="/ui/productos/buscar-producto" hx-trigger="keyup changed delay:300ms, focus" hx-target="#productoResultados">
                <div id="productoResultados"></div>
            </div>

            <div>
                <label class="form-label" for="inputCantidad">Cantidad</label>
                <input type="number" id="inputCantidad" value="1" min="1" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-ghost" onclick="VentaManager.agregarItemDesdeInput(false)">
                <i class="fas fa-check"></i> Agregar y Cerrar
            </button>
            <button type="button" class="btn-add" onclick="VentaManager.agregarItemDesdeInput(true)">
                <i class="fas fa-plus-circle"></i> Agregar y Continuar
            </button>
        </div>
    </div>
</div>

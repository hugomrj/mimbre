<div class="toolbar">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">
            Nueva Venta / Facturación
        </h2>
    </div>
</div>

<div class="table-card" style="padding: 24px;">

    <form hx-post="/ui/ventas/save" hx-target="#id-main" hx-select="#id-main" class="form-container" id="formVenta">

        <!-- FILA 1: Cliente (4/6) + Condición (2/6) -->
        <div class="form-group col-4">
            <label class="form-label" for="selectCliente">Cliente</label>
            <select id="selectCliente" name="clienteId" required class="form-control vanilla-select">
                <option value="" disabled selected>Seleccione un cliente</option>
                {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nombre }} - {{ c.rucDocumento }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="selectCondicion">Condición de Venta</label>
            <select id="selectCondicion" name="condicion" class="form-control vanilla-select">
                <option value="Contado" selected>Contado</option>
                <option value="Crédito">Crédito</option>
            </select>
        </div>

        <!-- Acción secundaria: agregar producto -->
        <div class="form-group col-full" style="align-items: flex-end; margin-top: 8px; margin-bottom: 0;">
            <button type="button" class="btn-outline" onclick="VentaManager.abrirModalProducto()">
                <i class="fas fa-plus"></i> Agregar Producto
            </button>
        </div>

        <!-- TABLA DE DETALLE DE LA VENTA -->
        <div class="form-group col-full" style="margin-top: 4px;">
            <table class="data-table" id="tablaItemsVenta">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th style="width: 120px; text-align: center;">Cantidad</th>
                    <th style="width: 150px; text-align: right;">Precio Venta</th>
                    <th style="width: 150px; text-align: right;">Subtotal</th>
                    <th style="width: 60px; text-align: center;">Acción</th>
                </tr>
                </thead>
                <tbody id="tbodyItemsVenta">
                <tr id="rowVacia">
                    <td colspan="5" style="text-align: center; padding: 24px; color: var(--dark-text-muted);">
                        No se han agregado productos a la venta.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- CONTENEDOR OCULTO PARA FORM INPUTS -->
        <div id="inputsOcultosDetalle"></div>

        <!-- TOTAL GENERAL -->
        <div class="form-group col-full" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; border-top: 1px solid var(--dark-card-border); padding-top: 16px; margin-top: 8px;">
            <div style="font-size: 1.1rem; color: var(--dark-text-muted);">
                Total a Pagar:
            </div>
            <div style="font-size: 1.75rem; font-weight: 700; color: var(--primary);" id="labelTotalVenta">
                0
            </div>
        </div>

        <!-- FILA DE ACCIONES -->
        <div class="form-actions">
            <button type="submit" class="btn-add"><i class="fas fa-check"></i> Emitir Factura / Confirmar Venta</button>
            <button type="button" class="btn-ghost" hx-get="/ui/ventas/list" hx-target="#id-main" hx-select="#id-main">Cancelar</button>
        </div>

    </form>
</div>

<!-- MODAL BÚSQUEDA Y SELECCIÓN DE PRODUCTO -->
<div id="modalProducto" class="modal-overlay">
    <div class="modal-container modal-container--wide">
        <div class="modal-header">
            <div class="modal-title">
                <i class="fas fa-search" style="color: var(--primary);"></i> Buscar y Agregar Producto
            </div>
            <button type="button" class="modal-close-btn" onclick="VentaManager.cerrarModalProducto()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div>
                <label class="form-label" for="selectProductoVenta">Producto</label>
                <select id="selectProductoVenta" class="form-control vanilla-select"
                        onchange="VentaManager.seleccionarProductoDesdeSelect(this)">
                    <option value="" disabled selected>Seleccione un producto</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" data-nombre="{{ p.nombre }}" data-precio-venta="{{ p.precioVenta }}" data-stock="{{ p.stock }}">
                        {{ p.nombre }} ({{ p.sku }}) - {{ p.precioVentaMiles }} - Stock {{ p.stock }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="cantidad-group">
                <label class="form-label" for="inputCantidad">Cantidad</label>
                <input type="number" id="inputCantidad" value="1" min="1" class="form-control cantidad-input">
            </div>
        </div>
        <!-- ✅ FIX: jerarquía de botones — primario (Agregar y Cerrar) a la derecha, secundario (Continuar) a la izquierda -->
        <div class="modal-footer modal-footer--izquierda">
            <button type="button" class="btn-ghost" onclick="VentaManager.agregarItemDesdeInput(true)">
                <i class="fas fa-plus-circle"></i> Agregar y Continuar
            </button>
            <button type="button" class="btn-add" onclick="VentaManager.agregarItemDesdeInput(false)">
                <i class="fas fa-check"></i> Agregar y Cerrar
            </button>
        </div>
    </div>
</div>

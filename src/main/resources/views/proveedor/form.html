<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">
            {% if proveedor.id %}Editar Proveedor{% else %}Nuevo Proveedor{% endif %}
        </h2>
    </div>
</div>

<div class="table-card animate-fade-in delay-2" style="padding: 24px;">

    <form hx-post="/ui/proveedores/save" hx-target="#id-main" class="form-container">

        {% if proveedor.id %}
        <input type="hidden" name="id" value="{{ proveedor.id }}">
        {% endif %}

        <!-- FILA 1: Nombre / Razón Social (4/6) + RUC (2/6) -->
        <div class="form-group col-4">
            <label class="form-label" for="provNombre">Nombre / Razón Social</label>
            <input type="text" id="provNombre" name="nombre" value="{{ proveedor.nombre }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="provRuc">RUC / Documento Fiscal</label>
            <input type="text" id="provRuc" name="ruc" value="{{ proveedor.ruc }}" required class="form-control">
        </div>

        <!-- FILA 2: Teléfono (3/6) + Email (3/6) -->
        <div class="form-group col-3">
            <label class="form-label" for="provTelefono">Teléfono</label>
            <input type="text" id="provTelefono" name="telefono" value="{{ proveedor.telefono }}" required class="form-control">
        </div>

        <div class="form-group col-3">
            <label class="form-label" for="provEmail">Correo Electrónico</label>
            <input type="email" id="provEmail" name="email" value="{{ proveedor.email }}" required class="form-control">
        </div>

        <!-- FILA 3: Dirección (6/6) -->
        <div class="form-group col-full">
            <label class="form-label" for="provDireccion">Dirección</label>
            <input type="text" id="provDireccion" name="direccion" value="{{ proveedor.direccion }}" class="form-control">
        </div>

        <!-- FILA 4: Botones -->
        <div class="form-actions">
            <button type="submit" class="btn-add">Guardar Proveedor</button>
            <button type="button" class="btn-ghost" hx-get="/ui/proveedores/list" hx-target="#id-main">Cancelar</button>
        </div>

    </form>
</div>

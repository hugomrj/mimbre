{% extends "layout.html" %}

{% block navbar_title %}
{% if proveedor.id %}Editar Proveedor{% else %}Nuevo Proveedor{% endif %}
{% endblock %}

{% block content %}
<div class="page-view page-view--medium">

    <div data-page-title="{% if proveedor.id %}Editar Proveedor{% else %}Nuevo Proveedor{% endif %}" style="display:none;"></div>

    <div class="table-card">
        <div style="padding: 24px;">

            <form hx-post="/ui/proveedores/save" hx-target="#id-main" hx-select="#id-main"
                  hx-push-url="/ui/proveedores/list" class="form-container">

                {% if proveedor.id %}
                <input type="hidden" name="id" value="{{ proveedor.id }}">
                {% endif %}

                <div class="form-group col-4">
                    <label class="form-label" for="provNombre">Nombre / Razón Social</label>
                    <input type="text" id="provNombre" name="nombre" value="{{ proveedor.nombre }}" required class="form-control">
                </div>

                <div class="form-group col-2">
                    <label class="form-label" for="provRuc">RUC / Documento Fiscal</label>
                    <input type="text" id="provRuc" name="ruc" value="{{ proveedor.ruc }}" required class="form-control">
                </div>

                <div class="form-group col-3">
                    <label class="form-label" for="provTelefono">Teléfono</label>
                    <input type="text" id="provTelefono" name="telefono" value="{{ proveedor.telefono }}" class="form-control">
                </div>

                <div class="form-group col-3">
                    <label class="form-label" for="provEmail">Correo Electrónico</label>
                    <input type="email" id="provEmail" name="email" value="{{ proveedor.email }}" class="form-control">
                </div>

                <div class="form-group col-full">
                    <label class="form-label" for="provDireccion">Dirección</label>
                    <input type="text" id="provDireccion" name="direccion" value="{{ proveedor.direccion }}" class="form-control">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-add">Guardar Proveedor</button>
                    <button type="button" class="btn-ghost"
                            hx-get="/ui/proveedores/list" hx-target="#id-main"
                            hx-select="#id-main" hx-push-url="true">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

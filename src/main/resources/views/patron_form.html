<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">
            {% if product.id %}Editar Producto{% else %}Nuevo Producto{% endif %}
        </h2>
    </div>
</div>

<div class="table-card animate-fade-in delay-2" style="padding: 24px;">

    <form hx-post="/ui/products/save" hx-target="#id-main" class="form-container">

        {% if product.id %}
        <input type="hidden" name="id" value="{{ product.id }}">
        {% endif %}

        <!-- FILA 1: Nombre ocupa todo el ancho (6/6) -->
        <div class="form-group col-full">
            <label class="form-label" for="prodName">Nombre del producto</label>
            <input type="text" id="prodName" name="name" value="{{ product.name }}" required class="form-control">
        </div>

        <!-- FILA 2: SKU (2/6) + Categoría (4/6) = 6 columnas completas -->
        <div class="form-group col-2">
            <label class="form-label" for="prodSku">SKU / Código</label>
            <input type="text" id="prodSku" name="sku" value="{{ product.sku }}" required class="form-control">
        </div>

        <div class="form-group col-4">
            <label class="form-label" for="prodCategory">Categoría</label>
            <input type="text" id="prodCategory" name="category" value="{{ product.category }}" required class="form-control">
        </div>

        <!-- FILA 3: Precio (3/6) + Stock (3/6) = 6 columnas completas -->
        <div class="form-group col-2">
            <label class="form-label" for="prodPrice">Precio</label>
            <input type="number" id="prodPrice" step="0.01" name="price" value="{{ product.price }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="prodStock">Stock Actual</label>
            <input type="number" id="prodStock" name="stock" value="{{ product.stock }}" required class="form-control">
        </div>

        <!-- FILA 4: Botones de acción (siempre col-full / 6/6) -->
        <div class="form-actions">
            <button type="submit" class="btn-add">Guardar Producto</button>
            <button type="button" class="btn-ghost" hx-get="/ui/products/table" hx-target="#id-main">Cancelar</button>
        </div>

    </form>
</div>

<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">
            {% if cliente.id %}Editar Cliente{% else %}Nuevo Cliente{% endif %}
        </h2>
    </div>
</div>

<div class="table-card animate-fade-in delay-2" style="padding: 24px;">

    <form hx-post="/ui/clientes/save" hx-target="#id-main" class="form-container">

        {% if cliente.id %}
        <input type="hidden" name="id" value="{{ cliente.id }}">
        {% endif %}

        <!-- FILA 1: Nombre (4/6) + RUC/Doc (2/6) -->
        <div class="form-group col-4">
            <label class="form-label" for="cliNombre">Nombre / Razón Social</label>
            <input type="text" id="cliNombre" name="nombre" value="{{ cliente.nombre }}" required class="form-control">
        </div>

        <div class="form-group col-2">
            <label class="form-label" for="cliRuc">RUC / Cédula / Documento</label>
            <input type="text" id="cliRuc" name="rucDocumento" value="{{ cliente.rucDocumento }}" required class="form-control">
        </div>

        <!-- FILA 2: Teléfono (3/6) + Email (3/6) -->
        <div class="form-group col-3">
            <label class="form-label" for="cliTelefono">Teléfono</label>
            <input type="text" id="cliTelefono" name="telefono" value="{{ cliente.telefono }}" required class="form-control">
        </div>

        <div class="form-group col-3">
            <label class="form-label" for="cliEmail">Correo Electrónico</label>
            <input type="email" id="cliEmail" name="email" value="{{ cliente.email }}" required class="form-control">
        </div>

        <!-- FILA 3: Dirección (6/6) -->
        <div class="form-group col-full">
            <label class="form-label" for="cliDireccion">Dirección</label>
            <input type="text" id="cliDireccion" name="direccion" value="{{ cliente.direccion }}" class="form-control">
        </div>

        <!-- FILA 4: Botones -->
        <div class="form-actions">
            <button type="submit" class="btn-add">Guardar Cliente</button>
            <button type="button" class="btn-ghost" hx-get="/ui/clientes/list" hx-target="#id-main">Cancelar</button>
        </div>

    </form>
</div>

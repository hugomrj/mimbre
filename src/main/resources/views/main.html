<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090E1E"> <!-- Color de la barra del navegador en móvil -->
    <title>FARO - Dashboard</title>

    <!-- 1. FUENTE INTER -->
    <!-- Fuentes locales desactivadas por ahora, usando font-family por defecto -->

    <!-- Iconos -->
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">

    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- HTMX -->
    <script src="/vendor/htmx/htmx.min.js"></script>

    <!-- Chart.js -->
    <script src="/vendor/chartjs/chart.min.js"></script>

    <!-- Scripts de la aplicación -->
    <script src="/js/main.js"></script>
    <script src="/js/venta.js"></script>
    <script src="/js/compra.js"></script>
</head>


<body data-theme="dark">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i class="fas fa-lightbulb"></i></div>
            <span class="sidebar-brand-text">FARO</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" hx-get="/ui/dashboard" hx-target="#id-main" onclick="navTo(this, event)">
                <i class="fas fa-th-large nav-icon"></i>
                <span class="nav-label">Inicio</span>
            </a>

            <button class="nav-item expanded" onclick="toggleSub(this)">
                <i class="fas fa-box nav-icon"></i>
                <span class="nav-label">Inventario</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub open">
                <a href="#" class="nav-sub-item" hx-get="/ui/productos/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Productos</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/categorias/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Categorias</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/proveedores/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Proveedores</span></a>
            </div>

            <button class="nav-item" onclick="toggleSub(this)">
                <i class="fas fa-store nav-icon"></i>
                <span class="nav-label">Comercial</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub">
                 <a href="#" class="nav-sub-item" hx-get="/ui/ventas/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Ventas</span></a>
                 <a href="#" class="nav-sub-item" hx-get="/ui/compras/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Compras</span></a>
                 <a href="#" class="nav-sub-item" hx-get="/ui/clientes/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Clientes</span></a>
            </div>

            <a href="#" class="nav-item" onclick="navTo(this, event)">
                <i class="fas fa-chart-bar nav-icon"></i>
                <span class="nav-label">Reportes</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name">Admin</div>
                    <div class="sidebar-user-email">admin@faro.com</div>
                </div>
                <div class="sidebar-footer-actions">
                    <button class="sidebar-icon-btn" onclick="toggleTheme()" title="Cambiar tema"><i class="fas fa-moon" id="theme-icon"></i></button>
                    <button class="sidebar-icon-btn" onclick="showToast('Sesion cerrada')" title="Cerrar sesion"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <div class="content-area">
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="navbar-title" id="navbarTitle">Productos</h1>
            </div>
            <div class="navbar-actions">
                <div class="navbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>

                <!--
                <button class="navbar-btn" onclick="showToast('Notificaciones')">
                    <i class="fas fa-bell"></i><span class="badge">3</span>
                </button>
                -->

                <button class="navbar-btn"><i class="fas fa-cog"></i></button>
                <div class="navbar-avatar">A</div>
            </div>
        </header>

        <main class="app-main" style="flex: 1; padding: 24px; overflow-y: auto;">
            <div id="id-main" class="container-fluid" hx-get="/ui/dashboard" hx-trigger="load">
                <!-- HTMX cargará la tabla o formulario aquí automáticamente -->
            </div>
        </main>
    </div>
</div>

<div id="toastContainer" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>

<!-- MODAL GLOBAL DE CONFIRMACIÓN DE ELIMINACIÓN -->
<div id="modalConfirmarEliminacion" class="modal-overlay">
    <div class="modal-container" style="max-width: 440px;">
        <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
            <div class="modal-title" style="color: #F43F5E;">
                <i class="fas fa-exclamation-triangle"></i> ¿Confirmar Eliminación?
            </div>
            <button type="button" class="modal-close-btn" onclick="cerrarModalEliminacion()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body" style="padding-top: 12px; padding-bottom: 20px;">
            <p id="modalConfirmarTexto" style="color: var(--dark-text); font-size: 0.95rem; margin: 0; line-height: 1.5;">
                ¿Está seguro de que desea eliminar este registro? Esta acción no se puede deshacer.
            </p>
        </div>
        <div class="modal-footer" style="border-top: 1px solid var(--dark-card-border); padding-top: 16px;">
            <button type="button" class="btn-ghost" onclick="cerrarModalEliminacion()">
                Cancelar
            </button>
            <button type="button" class="btn-add" id="btnConfirmarEliminar" style="background: #F43F5E; border-color: #F43F5E;" onclick="cerrarModalEliminacion()">
                <i class="fas fa-trash-alt"></i> Confirmar y Eliminar
            </button>
        </div>
    </div>
</div>

<script>
    function createWaveRipple(e, element) {
        const rect = element.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const size = Math.max(rect.width, rect.height) * 1.2;
        const ripple = document.createElement('div');
        ripple.className = 'wave-ripple';
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (x - size / 2) + 'px';
        ripple.style.top = (y - size / 2) + 'px';
        element.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    // Usar event delegation para HTMX
    document.body.addEventListener('click', function(e) { 
        if(e.target.closest('.nav-item, .nav-sub-item, .sidebar-icon-btn, .btn-add, .btn-ghost')) {
            createWaveRipple(e, e.target.closest('.nav-item, .nav-sub-item, .sidebar-icon-btn, .btn-add, .btn-ghost'));
        }
    });

    function fmt(n) { return '₲ ' + n.toLocaleString('es-PY'); }
</script>
</body>
</html>

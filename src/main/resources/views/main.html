<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090E1E">
    <title>Mimbre - Dashboard</title>

    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/vendor/htmx/htmx.min.js"></script>
    <script src="/vendor/chartjs/chart.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/venta.js"></script>
    <script src="/js/compra.js"></script>
</head>

<body data-theme="dark" data-palette="cyan">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i class="fas fa-lightbulb"></i></div>
            <span class="sidebar-brand-text">MIMBRE</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" hx-get="/ui/dashboard" hx-target="#id-main" onclick="navTo(this, event)">
                <i class="fas fa-th-large nav-icon"></i>
                <span class="nav-label">Inicio</span>
            </a>

            <button class="nav-item expanded" onclick="toggleSub(this)">
                <i class="fas fa-box nav-icon"></i>
                <span class="nav-label">Inventario</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub open">
                <a href="#" class="nav-sub-item" hx-get="/ui/productos/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Productos</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/categorias/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Categorias</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/proveedores/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Proveedores</span></a>
            </div>

            <button class="nav-item" onclick="toggleSub(this)">
                <i class="fas fa-store nav-icon"></i>
                <span class="nav-label">Comercial</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub">
                <a href="#" class="nav-sub-item" hx-get="/ui/ventas/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Ventas</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/compras/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Compras</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/clientes/list" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Clientes</span></a>
            </div>

            <a href="#" class="nav-item" onclick="navTo(this, event)">
                <i class="fas fa-chart-bar nav-icon"></i>
                <span class="nav-label">Reportes</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">A</div>
                <button class="sidebar-icon-btn" onclick="toggleTheme()" title="Cambiar tema">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
            </div>
        </div>
    </aside>

    <div class="content-area">
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="navbar-title" id="navbarTitle">Inicio</h1>
            </div>

            <div class="navbar-actions">
                <div class="navbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>

                <button class="navbar-btn" onclick="openSettingsModal()" title="Personalizar paleta">
                    <i class="fas fa-palette"></i>
                </button>

                <div class="navbar-avatar">A</div>
            </div>
        </header>

        <main class="app-main">
            <div id="id-main" class="container-fluid" hx-get="/ui/dashboard" hx-trigger="load">
                <!-- HTMX carga aquí -->
            </div>
        </main>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<!-- MODAL DE CONFIRMACIÓN -->
<div id="modalConfirmarEliminacion" class="modal-overlay">
    <div class="modal-container" style="max-width: 440px;">
        <div class="modal-header">
            <div class="modal-title" style="color: var(--state-danger-text);">
                <i class="fas fa-exclamation-triangle"></i> ¿Confirmar Eliminación?
            </div>
            <button type="button" class="modal-close-btn" onclick="cerrarModalEliminacion()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <p id="modalConfirmarTexto" style="color: var(--text-main); margin: 0;">
                ¿Está seguro de que desea eliminar este registro? Esta acción no se puede deshacer.
            </p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-ghost" onclick="cerrarModalEliminacion()">Cancelar</button>
            <button type="button" class="btn-primary" id="btnConfirmarEliminar">
                <i class="fas fa-trash-alt"></i> Confirmar y Eliminar
            </button>
        </div>
    </div>
</div>

<!-- MODAL DE PALETAS (Con la estructura corregida) -->
<div class="modal-overlay" id="modalConfiguracion" onclick="if(event.target===this) closeSettingsModal()">
    <div class="modal-container" style="max-width: 480px;">
        <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-palette"></i> Paleta de Colores</h3>
            <button class="modal-close-btn" onclick="closeSettingsModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <label class="form-label">Elige el estilo visual para tu sistema</label>

            <div class="palette-grid">
                <!-- Cyan -->
                <button class="palette-item" data-palette="cyan" onclick="applyPalette('cyan')">
                    <span class="palette-circle" style="background: #06B6D4;"></span>
                    <span class="palette-label">Cyan</span>
                </button>

                <!-- Emerald -->
                <button class="palette-item" data-palette="emerald" onclick="applyPalette('emerald')">
                    <span class="palette-circle" style="background: #10B981;"></span>
                    <span class="palette-label">Emerald</span>
                </button>

                <!-- Orange -->
                <button class="palette-item" data-palette="orange" onclick="applyPalette('orange')">
                    <span class="palette-circle" style="background: #F97316;"></span>
                    <span class="palette-label">Orange</span>
                </button>

                <!-- Sunset -->
                <button class="palette-item" data-palette="sunset" onclick="applyPalette('sunset')">
                    <span class="palette-circle" style="background: #F43F5E;"></span>
                    <span class="palette-label">Sunset</span>
                </button>

                <!-- Violet -->
                <button class="palette-item" data-palette="violet" onclick="applyPalette('violet')">
                    <span class="palette-circle" style="background: #8B5CF6;"></span>
                    <span class="palette-label">Violet</span>
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeSettingsModal()">Cerrar</button>
        </div>
    </div>
</div>

<script>
    function createWaveRipple(e, element) {
        const rect = element.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const size = Math.max(rect.width, rect.height) * 1.2;
        const ripple = document.createElement('div');
        ripple.className = 'wave-ripple';
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (x - size / 2) + 'px';
        ripple.style.top = (y - size / 2) + 'px';
        element.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    document.body.addEventListener('click', function(e) {
        const selector = '.nav-item, .nav-sub-item, .sidebar-icon-btn, .btn-primary, .btn-add, .btn-ghost, .navbar-btn, .filter-chip, .row-action-btn';
        const target = e.target.closest(selector);
        if (target) {
            createWaveRipple(e, target);
        }
    });

    function fmt(n) { return '₲ ' + n.toLocaleString('es-PY'); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090E1E"> <!-- Color de la barra del navegador en móvil -->
    <title>FARO - Dashboard</title>

    <!-- 1. FUENTE INTER (CRÍTICO: Tu CSS depende de esto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="/css/main.css">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Scripts de la aplicación -->
    <script src="/js/main.js"></script>
    <script src="/js/venta.js"></script>
</head>


<body data-theme="dark">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i class="fas fa-lightbulb"></i></div>
            <span class="sidebar-brand-text">FARO</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" hx-get="/ui/dashboard" hx-target="#id-main" onclick="navTo(this, event)">
                <i class="fas fa-th-large nav-icon"></i>
                <span class="nav-label">Inicio</span>
            </a>

            <button class="nav-item expanded" onclick="toggleSub(this)">
                <i class="fas fa-box nav-icon"></i>
                <span class="nav-label">Inventario</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub open">
                <a href="#" class="nav-sub-item" hx-get="/ui/productos/table" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Productos</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/categorias/table" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Categorias</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/proveedores/table" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Proveedores</span></a>
            </div>

            <button class="nav-item" onclick="toggleSub(this)">
                <i class="fas fa-store nav-icon"></i>
                <span class="nav-label">Comercial</span>
                <i class="fas fa-chevron-down nav-chevron"></i>
            </button>
            <div class="nav-sub">
                <a href="#" class="nav-sub-item" hx-get="/ui/ventas/table" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Ventas</span></a>
                <a href="#" class="nav-sub-item" hx-get="/ui/clientes/table" hx-target="#id-main" onclick="navTo(this, event)"><span class="nav-sub-dot"></span><span>Clientes</span></a>
            </div>

            <a href="#" class="nav-item" onclick="navTo(this, event)">
                <i class="fas fa-chart-bar nav-icon"></i>
                <span class="nav-label">Reportes</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">A</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name">Admin</div>
                    <div class="sidebar-user-email">admin@faro.com</div>
                </div>
                <div class="sidebar-footer-actions">
                    <button class="sidebar-icon-btn" onclick="toggleTheme()" title="Cambiar tema"><i class="fas fa-moon" id="theme-icon"></i></button>
                    <button class="sidebar-icon-btn" onclick="showToast('Sesion cerrada')" title="Cerrar sesion"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <div class="content-area">
        <header class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 class="navbar-title" id="navbarTitle">Productos</h1>
            </div>
            <div class="navbar-actions">
                <div class="navbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>

                <!--
                <button class="navbar-btn" onclick="showToast('Notificaciones')">
                    <i class="fas fa-bell"></i><span class="badge">3</span>
                </button>
                -->

                <button class="navbar-btn"><i class="fas fa-cog"></i></button>
                <div class="navbar-avatar">A</div>
            </div>
        </header>

        <main class="app-main" style="flex: 1; padding: 24px; overflow-y: auto;">
            <div id="id-main" class="container-fluid" hx-get="/ui/dashboard" hx-trigger="load">
                <!-- HTMX cargará la tabla o formulario aquí automáticamente -->
            </div>
        </main>
    </div>
</div>

<div id="toastContainer" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>

<script>
    function createWaveRipple(e, element) {
        const rect = element.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const size = Math.max(rect.width, rect.height) * 1.2;
        const ripple = document.createElement('div');
        ripple.className = 'wave-ripple';
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (x - size / 2) + 'px';
        ripple.style.top = (y - size / 2) + 'px';
        element.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }

    // Usar event delegation para HTMX
    document.body.addEventListener('click', function(e) { 
        if(e.target.closest('.nav-item, .nav-sub-item, .sidebar-icon-btn, .btn-add, .btn-ghost')) {
            createWaveRipple(e, e.target.closest('.nav-item, .nav-sub-item, .sidebar-icon-btn, .btn-add, .btn-ghost'));
        }
    });

    function fmt(n) { return '₲ ' + n.toLocaleString('es-PY'); }
</script>
</body>
</html>

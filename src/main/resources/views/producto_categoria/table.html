<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-filters">
        <button class="filter-chip active" onclick="setFilter(this)">Todas <span class="count">{{ categorias.size() | default(0) }}</span></button>
    </div>
    <div class="toolbar-right">
        <button class="btn-ghost" onclick="showToast('Exportando...')"><i class="fas fa-file-export"></i> Exportar</button>
        <button class="btn-add" hx-get="/ui/categorias/form" hx-target="#id-main"><i class="fas fa-plus"></i> Nueva categoría</button>
    </div>
</div>

<div class="table-card animate-fade-in delay-2">
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th style="text-align:right">Acciones</th>
        </tr>
        </thead>
        <tbody>
        {% for c in categorias %}
        <tr class="row-anim" style="animation-delay: 0.04s">
            <td>{{ c.id }}</td>
            <td><strong>{{ c.nombre }}</strong></td>
            <td style="color:var(--dark-text-muted)">{{ c.descripcion }}</td>
            <td>
                <div class="row-actions">
                    <button class="row-action-btn" title="Editar" hx-get="/ui/categorias/form?id={{ c.id }}" hx-target="#id-main"><i class="fas fa-pen"></i></button>
                    <button class="row-action-btn" title="Eliminar" onclick="abrirModalEliminacion('{{ c.nombre }}', '/ui/categorias/delete/{{ c.id }}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" style="text-align: center; padding: 32px; color: var(--dark-text-muted);">No hay categorías registradas.</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% if mensaje %}
<script>if (typeof showToast === 'function') showToast("{{ mensaje }}", "success");</script>
{% endif %}
{% if error %}
<script>if (typeof showToast === 'function') showToast("{{ error }}", "error");</script>
{% endif %}

<!-- src/main/resources/views/dashboard.html -->
<!-- TARJETAS DE KPIs -->
<div class="kpi-grid animate-fade-in delay-1">

    <!-- KPI 1: Ventas del Mes -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-primary">
                <i class="fas fa-wallet"></i>
            </div>
            <span class="kpi-badge kpi-badge-primary">
                <i class="fas fa-calendar-alt"></i> Mes Actual
            </span>
        </div>
        <div class="kpi-value" id="kpiVentasMes">₲ 0</div>
        <div class="kpi-label">Ventas del Mes</div>
    </div>

    <!-- KPI 2: Facturas Emitidas -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-warning">
                <i class="fas fa-file-invoice-dollar"></i>
            </div>
            <span class="kpi-badge kpi-badge-warning">
                Completadas
            </span>
        </div>
        <div class="kpi-value" id="kpiFacturas">0</div>
        <div class="kpi-label">Facturas Emitidas</div>
    </div>

    <!-- KPI 3: Productos en Catálogo -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-success">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <span class="kpi-badge kpi-badge-success">
                Catálogo
            </span>
        </div>
        <div class="kpi-value" id="kpiProductos">0</div>
        <div class="kpi-label">Productos Registrados</div>
    </div>

    <!-- KPI 4: Clientes -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-secondary">
                <i class="fas fa-users"></i>
            </div>
            <span class="kpi-badge kpi-badge-secondary">
                Registrados
            </span>
        </div>
        <div class="kpi-value" id="kpiClientes">0</div>
        <div class="kpi-label">Clientes Registrados</div>
    </div>
</div>

<!-- SECCIÓN: PRODUCTOS QUE REQUIEREN RECOMPRA -->
<div class="table-card animate-fade-in delay-2" style="padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin: 0;">
            <i class="fas fa-boxes" style="color: var(--state-danger-text); margin-right: 8px;"></i> PRODUCTOS PRÓXIMOS A AGOTARSE
        </h3>
        <button class="btn-ghost" hx-get="/ui/productos/list" hx-target="#id-main">
            Ir a Inventario <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>
        </button>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Producto</th>
            <th>SKU</th>
            <th>Categoría</th>
            <th style="text-align: right;">Precio Unitario</th>
            <th style="text-align: center;">Stock Actual</th>
            <th style="text-align: center;">Estado</th>
        </tr>
        </thead>
        <tbody id="tbodyBajoStock">
        <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">
                Cargando datos de inventario...
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- INICIALIZACIÓN VÍA FETCH A REST API -->
<script>
    (function loadDashboardData() {
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(data => {
                // 1. Actualizar KPIs
                const kpiVentas = document.getElementById('kpiVentasMes');
                const kpiFacturas = document.getElementById('kpiFacturas');
                const kpiProductos = document.getElementById('kpiProductos');
                const kpiClientes = document.getElementById('kpiClientes');

                if (kpiVentas) kpiVentas.textContent = '₲ ' + (data.totalVentasMes || 0).toLocaleString('es-PY');
                if (kpiFacturas) kpiFacturas.textContent = data.facturasEmitidasCount || 0;
                if (kpiProductos) kpiProductos.textContent = data.totalProductosCount || 0;
                if (kpiClientes) kpiClientes.textContent = data.totalClientesCount || 0;

                // 2. Renderizar Tabla de Stock Bajo
                const tbody = document.getElementById('tbodyBajoStock');
                if (tbody) {
                    tbody.innerHTML = '';
                    const lista = data.productosBajoStockList || [];
                    if (lista.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--state-success-text); padding: 24px; font-weight: 500;">
                                    <i class="fas fa-check-circle" style="margin-right: 8px;"></i> Todos los productos tienen suficiente nivel de stock.
                                </td>
                            </tr>`;
                    } else {
                        lista.forEach(prod => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td><strong>${prod.nombre || ''}</strong></td>
                                <td><code>${prod.sku || ''}</code></td>
                                <td>${prod.categoria || 'General'}</td>
                                <td style="text-align: right; font-weight: 600;">₲ ${(prod.precio || 0).toLocaleString('es-PY')}</td>
                                <td style="text-align: center; font-weight: 700; color: var(--state-danger-text);">
                                    ${prod.stock || 0} un.
                                </td>
                                <td style="text-align: center;">
                                    <span class="status-badge" style="background: var(--state-danger-bg); color: var(--state-danger-text); padding: 4px 10px; border-radius: 50px; font-weight: 600; font-size: 0.75rem;">
                                        Recomprar
                                    </span>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                }
            })
            .catch(err => console.error('Error al cargar datos del dashboard:', err));
    })();
</script>

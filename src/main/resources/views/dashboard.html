<!-- src/main/resources/views/dashboard.html -->
{% extends "layout.html" %}

{% block content %}
<!-- ✅ Título dinámico para el navbar -->
<div style="display: none;">
    <h1 class="navbar-title" id="navbarTitle" hx-swap-oob="true">Inicio</h1>
</div>

<!-- TARJETAS DE KPIs -->
<div class="kpi-grid">
    <!-- KPI 1: Ventas del Mes -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-primary"><i class="fas fa-wallet"></i></div>
            <span class="kpi-badge kpi-badge-primary">Mes Actual</span>
        </div>
        <div class="kpi-value" id="kpiVentasMes">₲ 0</div>
        <div class="kpi-label">Ventas del Mes</div>
    </div>

    <!-- KPI 2: Facturas Emitidas -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-warning"><i class="fas fa-file-invoice-dollar"></i></div>
            <span class="kpi-badge kpi-badge-warning">Completadas</span>
        </div>
        <div class="kpi-value" id="kpiFacturas">0</div>
        <div class="kpi-label">Facturas Emitidas</div>
    </div>

    <!-- KPI 3: Productos en Catálogo -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-success"><i class="fas fa-boxes-stacked"></i></div>
            <span class="kpi-badge kpi-badge-success">Catálogo</span>
        </div>
        <div class="kpi-value" id="kpiProductos">0</div>
        <div class="kpi-label">Productos Registrados</div>
    </div>

    <!-- KPI 4: Clientes -->
    <div class="kpi-card">
        <div class="kpi-header">
            <div class="kpi-icon kpi-icon-secondary"><i class="fas fa-users"></i></div>
            <span class="kpi-badge kpi-badge-secondary">Registrados</span>
        </div>
        <div class="kpi-value" id="kpiClientes">0</div>
        <div class="kpi-label">Clientes Registrados</div>
    </div>
</div>

<!-- SECCIÓN: GRÁFICO DE SERIES -->
<!-- ✅ Agregamos overflow: visible para que no se corten los tooltips del gráfico -->
<div class="table-card" style="padding: 24px; overflow: visible;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin: 0;">
            <i class="fas fa-chart-bar" style="color: var(--primary); margin-right: 8px;"></i> Resumen de Actividad (Simulador)
        </h3>
    </div>

    <div style="position: relative; height: 320px; width: 100%;">
        <canvas id="dashboardChart"></canvas>
    </div>
</div>

<!-- INICIALIZACIÓN VÍA FETCH Y CHART.JS -->
<script>
    (function loadDashboardData() {
        // 1. Obtener los KPIs de la API
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(data => {
                const kpiVentas = document.getElementById('kpiVentasMes');
                const kpiFacturas = document.getElementById('kpiFacturas');
                const kpiProductos = document.getElementById('kpiProductos');
                const kpiClientes = document.getElementById('kpiClientes');

                if (kpiVentas) kpiVentas.textContent = '₲ ' + (data.totalVentasMes || 0).toLocaleString('es-PY');
                if (kpiFacturas) kpiFacturas.textContent = data.facturasEmitidasCount || 0;
                if (kpiProductos) kpiProductos.textContent = data.totalProductosCount || 0;
                if (kpiClientes) kpiClientes.textContent = data.totalClientesCount || 0;
            })
            .catch(err => console.error('Error al cargar datos del dashboard:', err));

        // 2. Renderizar el Gráfico de Series
        const canvas = document.getElementById('dashboardChart');
        if (!canvas) return;

        // Extraer los 5 colores del CSS
        const style = getComputedStyle(document.body);
        const chartColors = [
            style.getPropertyValue('--chart-1').trim(),
            style.getPropertyValue('--chart-2').trim(),
            style.getPropertyValue('--chart-3').trim(),
            style.getPropertyValue('--chart-4').trim(),
            style.getPropertyValue('--chart-5').trim()
        ];

        const textColor = style.getPropertyValue('--text-main').trim();
        // ✅ Corrección: Usamos --border-line
        const gridColor = style.getPropertyValue('--border-line').trim();

        // Evitar que se dupliquen gráficos
        if (window.dashboardChartInstance) {
            window.dashboardChartInstance.destroy();
        }

        // Datos de prueba
        const rawData = [
            { label: 'Ventas', value: 80 },
            { label: 'Compras', value: 65 },
            { label: 'Inventario', value: 55 },
            { label: 'Clientes', value: 45 },
            { label: 'Proveedores', value: 30 }
        ];

        rawData.sort((a, b) => b.value - a.value);
        const sortedLabels = rawData.map(item => item.label);
        const sortedData = rawData.map(item => item.value);

        const ctx = canvas.getContext('2d');
        window.dashboardChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedLabels,
                datasets: [{
                    label: 'Simulación',
                    data: sortedData,
                    backgroundColor: chartColors,
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: style.getPropertyValue('--bg-app').trim(),
                        titleColor: textColor,
                        bodyColor: textColor,
                        borderColor: gridColor,
                        borderWidth: 1,
                        padding: 12,
                        displayColors: true
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        // ✅ Corrección: Fuente Inter en lugar de Outfit
                        ticks: { color: style.getPropertyValue('--text-muted').trim(), font: { family: 'Inter' } }
                    },
                    y: {
                        grid: { color: gridColor, drawBorder: false },
                        // ✅ Corrección: Fuente Inter
                        ticks: { color: style.getPropertyValue('--text-muted').trim(), font: { family: 'Inter' } }
                    }
                }
            }
        });
    })();
</script>
{% endblock %}

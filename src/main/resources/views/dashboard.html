<!-- TARJETAS DE KPIs CLARAS Y SENCILLAS -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;" class="animate-fade-in delay-1">

    <!-- KPI 1: Ventas del Mes (⭐ SE ADAPTA AL COLOR PRIMARIO) -->
    <div style="background: var(--dark-card); border: 1px solid var(--dark-card-border); border-radius: 20px; padding: 20px; box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 5%, transparent);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="width: 44px; height: 44px; background: color-mix(in srgb, var(--primary) 15%, transparent); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 1.15rem;">
                <i class="fas fa-wallet"></i>
            </div>
            <span style="background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600;">
                <i class="fas fa-calendar-alt"></i> Mes Actual
            </span>
        </div>
        <div style="font-size: 1.65rem; font-weight: 700; color: var(--dark-text); margin-bottom: 4px;" id="kpiVentasMes">₲ 0</div>
        <div style="font-size: 0.85rem; color: var(--dark-text-muted);">Ventas del Mes</div>
    </div>

    <!-- KPI 2: Facturas Emitidas (Color Semántico: Ámbar) -->
    <div style="background: var(--dark-card); border: 1px solid var(--dark-card-border); border-radius: 20px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="width: 44px; height: 44px; background: rgba(245,158,11,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #F59E0B; font-size: 1.15rem;">
                <i class="fas fa-file-invoice-dollar"></i>
            </div>
            <span style="background: rgba(245,158,11,0.12); color: #F59E0B; padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600;">
                Completadas
            </span>
        </div>
        <div style="font-size: 1.65rem; font-weight: 700; color: var(--dark-text); margin-bottom: 4px;" id="kpiFacturas">0</div>
        <div style="font-size: 0.85rem; color: var(--dark-text-muted);">Facturas Emitidas</div>
    </div>

    <!-- KPI 3: Productos en Catálogo (Color Semántico: Verde) -->
    <div style="background: var(--dark-card); border: 1px solid var(--dark-card-border); border-radius: 20px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="width: 44px; height: 44px; background: rgba(34,197,94,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #22C55E; font-size: 1.15rem;">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <span style="background: rgba(34,197,94,0.12); color: #22C55E; padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600;">
                Catálogo
            </span>
        </div>
        <div style="font-size: 1.65rem; font-weight: 700; color: var(--dark-text); margin-bottom: 4px;" id="kpiProductos">0</div>
        <div style="font-size: 0.85rem; color: var(--dark-text-muted);">Productos Registrados</div>
    </div>

    <!-- KPI 4: Clientes (Color Semántico: Púrpura) -->
    <div style="background: var(--dark-card); border: 1px solid var(--dark-card-border); border-radius: 20px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div style="width: 44px; height: 44px; background: rgba(168,85,247,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #A855F7; font-size: 1.15rem;">
                <i class="fas fa-users"></i>
            </div>
            <span style="background: rgba(168,85,247,0.12); color: #A855F7; padding: 4px 10px; border-radius: 50px; font-size: 0.75rem; font-weight: 600;">
                Registrados
            </span>
        </div>
        <div style="font-size: 1.65rem; font-weight: 700; color: var(--dark-text); margin-bottom: 4px;" id="kpiClientes">0</div>
        <div style="font-size: 0.85rem; color: var(--dark-text-muted);">Clientes Registrados</div>
    </div>
</div>

<!-- SECCIÓN: PRODUCTOS QUE REQUIEREN RECOMPRA -->
<div class="table-card animate-fade-in delay-2" style="padding: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.1rem; font-weight: 600; color: var(--dark-text); margin: 0;">
            <i class="fas fa-boxes" style="color: #F43F5E; margin-right: 8px;"></i> PRODUCTOS PRÓXIMOS A AGOTARSE
        </h3>
        <button class="btn-ghost" hx-get="/ui/productos/list" hx-target="#id-main">
            Ir a Inventario <i class="fas fa-arrow-right" style="margin-left: 6px;"></i>
        </button>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Producto</th>
            <th>SKU</th>
            <th>Categoría</th>
            <th style="text-align: right;">Precio Unitario</th>
            <th style="text-align: center;">Stock Actual</th>
            <th style="text-align: center;">Estado</th>
        </tr>
        </thead>
        <tbody id="tbodyBajoStock">
        <tr>
            <td colspan="6" style="text-align: center; color: var(--dark-text-muted); padding: 24px;">
                Cargando datos de inventario...
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- INICIALIZACIÓN AGNÓSTICA VÍA FETCH A REST API -->
<script>
    (function loadDashboardData() {
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(data => {
                // 1. Actualizar KPIs
                const kpiVentas = document.getElementById('kpiVentasMes');
                const kpiFacturas = document.getElementById('kpiFacturas');
                const kpiProductos = document.getElementById('kpiProductos');
                const kpiClientes = document.getElementById('kpiClientes');

                if (kpiVentas) kpiVentas.textContent = '₲ ' + (data.totalVentasMes || 0).toLocaleString('es-PY');
                if (kpiFacturas) kpiFacturas.textContent = data.facturasEmitidasCount || 0;
                if (kpiProductos) kpiProductos.textContent = data.totalProductosCount || 0;
                if (kpiClientes) kpiClientes.textContent = data.totalClientesCount || 0;

                // 2. Renderizar Tabla de Stock Bajo
                const tbody = document.getElementById('tbodyBajoStock');
                if (tbody) {
                    tbody.innerHTML = '';
                    const lista = data.productosBajoStockList || [];
                    if (lista.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" style="text-align: center; color: #22C55E; padding: 24px; font-weight: 500;">
                                    <i class="fas fa-check-circle" style="margin-right: 8px;"></i> Todos los productos tienen suficiente nivel de stock.
                                </td>
                            </tr>`;
                    } else {
                        lista.forEach(prod => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td><strong>${prod.nombre || ''}</strong></td>
                                <td><code>${prod.sku || ''}</code></td>
                                <td>${prod.categoria || 'General'}</td>
                                <td style="text-align: right; font-weight: 600;">₲ ${(prod.precio || 0).toLocaleString('es-PY')}</td>
                                <td style="text-align: center; font-weight: 700; color: #F43F5E;">
                                    ${prod.stock || 0} un.
                                </td>
                                <td style="text-align: center;">
                                    <span class="status-badge" style="background: rgba(244,63,94,0.15); color: #F43F5E; padding: 4px 10px; border-radius: 50px; font-weight: 600; font-size: 0.75rem;">
                                        Recomprar
                                    </span>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                }
            })
            .catch(err => console.error('Error al cargar datos del dashboard:', err));
    })();
</script>

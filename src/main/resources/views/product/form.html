<div class="toolbar animate-fade-in delay-1">
    <div class="toolbar-left">
        <h2 style="font-size: 1.25rem; font-weight: 600;">{% if product.id %}Editar Producto{% else %}Nuevo Producto{% endif %}</h2>
    </div>
</div>

<div class="table-card animate-fade-in delay-2" style="padding: 24px;">
    <!-- Como HTMX envía por defecto application/x-www-form-urlencoded, podemos mapearlo en backend o usar el plugin json-enc, por ahora mapeamos el action a la API o al UI controller -->
    <form hx-post="/ui/products/save" hx-target="#id-main" style="display: flex; flex-direction: column; gap: 16px; max-width: 500px;">
        
        {% if product.id %}
        <input type="hidden" name="id" value="{{ product.id }}">
        {% endif %}

        <div>
            <label style="display: block; font-size: 0.875rem; margin-bottom: 8px; color: var(--dark-text-muted);">Nombre del producto</label>
            <input type="text" name="name" value="{{ product.name }}" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--dark-card-border); background: var(--dark-input-bg); color: var(--dark-text); font-family: 'Inter', sans-serif;">
        </div>

        <div>
            <label style="display: block; font-size: 0.875rem; margin-bottom: 8px; color: var(--dark-text-muted);">SKU / Código</label>
            <input type="text" name="sku" value="{{ product.sku }}" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--dark-card-border); background: var(--dark-input-bg); color: var(--dark-text); font-family: 'Inter', sans-serif;">
        </div>

        <div style="display: flex; gap: 16px;">
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.875rem; margin-bottom: 8px; color: var(--dark-text-muted);">Precio</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--dark-card-border); background: var(--dark-input-bg); color: var(--dark-text); font-family: 'Inter', sans-serif;">
            </div>
            
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.875rem; margin-bottom: 8px; color: var(--dark-text-muted);">Stock Actual</label>
                <input type="number" name="stock" value="{{ product.stock }}" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--dark-card-border); background: var(--dark-input-bg); color: var(--dark-text); font-family: 'Inter', sans-serif;">
            </div>
        </div>

        <div>
            <label style="display: block; font-size: 0.875rem; margin-bottom: 8px; color: var(--dark-text-muted);">Categoría</label>
            <input type="text" name="category" value="{{ product.category }}" required style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--dark-card-border); background: var(--dark-input-bg); color: var(--dark-text); font-family: 'Inter', sans-serif;">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button type="submit" class="btn-add">Guardar Producto</button>
            <button type="button" class="btn-ghost" hx-get="/ui/products/table" hx-target="#id-main">Cancelar</button>
        </div>
    </form>
</div>

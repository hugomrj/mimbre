<!-- views/fragments/pagination.html -->
<div class="pagination-card">
    <div class="pagination">
        <!-- Anterior -->
        {% if currentPage > 0 %}
        <button class="page-btn" hx-get="{{ baseUrl }}?page={{ currentPage - 1 }}&size={{ size }}" hx-target="#id-main" hx-select="#id-main" hx-push-url="true">
            <i class="fas fa-chevron-left" style="font-size: 0.7rem;"></i>
        </button>
        {% else %}
        <button class="page-btn" disabled><i class="fas fa-chevron-left" style="font-size: 0.7rem;"></i></button>
        {% endif %}

        <!-- Números de página -->
        {% for i in range(0, totalPages) %}
        {% if i < totalPages %}
        <button class="page-btn {% if i == currentPage %}active{% endif %}"
                hx-get="{{ baseUrl }}?page={{ i }}&size={{ size }}" hx-target="#id-main" hx-select="#id-main" hx-push-url="true">
            {{ i + 1 }}
        </button>
        {% endif %}
        {% endfor %}

        <!-- Siguiente -->
        {% if currentPage < totalPages - 1 %}
        <button class="page-btn" hx-get="{{ baseUrl }}?page={{ currentPage + 1 }}&size={{ size }}" hx-target="#id-main" hx-select="#id-main" hx-push-url="true">
            <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
        </button>
        {% else %}
        <button class="page-btn" disabled><i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i></button>
        {% endif %}
    </div>

    <!-- Información -->
    <div class="pagination-info">
        <span>{{ startItem }}</span>-<span>{{ endItem }}</span> de <span>{{ totalElements }}</span>
    </div>
</div>

micronaut.application.name=mimbre

# Habilitar el servicio de archivos estáticos
micronaut.router.static-resources.default.paths=classpath:public
micronaut.router.static-resources.default.mapping=/**

# Configuración de vistas (Pebble)
micronaut.views.pebble.enabled=true



# Configuracion de Base de Datos H2
datasources.default.url=jdbc:h2:mem:data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
datasources.default.driverClassName=org.h2.Driver
datasources.default.username=sa
datasources.default.password=

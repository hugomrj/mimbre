micronaut.application.name=mimbre
micronaut.server.port=8000

# Habilitar el servicio de archivos estáticos
micronaut.router.static-resources.default.paths=classpath:public
micronaut.router.static-resources.default.mapping=/**

# Configuración de vistas (Pebble)
micronaut.views.pebble.enabled=true

# Configuración de Base de Datos H2
datasources.default.url=jdbc:h2:file:${user.home}/.mimbre/data/database;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
datasources.default.driverClassName=org.h2.Driver
datasources.default.username=sa
datasources.default.password=
datasources.default.dialect=H2
# Esquema versionado con Flyway (migraciones en classpath:db/migration)
datasources.default.schema-generate=NONE
flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration
flyway.datasources.default.baseline-on-migrate=true
flyway.datasources.default.baseline-version=1
flyway.datasources.default.baseline-description=esquema inicial

# Backup automatico al arrancar (ver BackupService)
app.backup.enabled=true
app.backup.source=${user.home}/.mimbre/data/database.mv.db
app.backup.dir=${user.home}/.mimbre/backups
app.backup.retention-days=30

# Inicializacion de datos demo y base plantilla (se desactiva en tests)
app.init.enabled=true
